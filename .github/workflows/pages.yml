name: Publica l'aplicació WASM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instal·la les dependències de construcció
        run: python -m pip install -r requirements.txt

      - name: Construeix l'aplicació Marimo WASM
        run: marimo export html-wasm app.py -o site --mode run --show-code -f

      - name: Construeix la comparació de solvers
        run: marimo export html-wasm solvers.py -o site/solvers --mode run --show-code -f

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Puja l'artefacte de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
